}

  log(`Input entries: ${restoredInputs} to restore, ${skippedInputs} already exist`, restoredInputs > 0 ? 'success' : '');
  if (missingInputs.length > 0) {
    log('Could not match inputs: ' + missingInputs.join(', '), 'error');
  }

  // === DAILY NOTES TO RESTORE ===
  const notesData = {
    '2026-02-13': "Today I felt like the air hunger was 95% gone in the afternoon and evening. Although, when I say this, I don\u2019t mean I\u2019ve pushed my body. This is only judged at rest. Most days I give a 1/5 should really be a 5/20. This afternoon I would have given a 1/20. I could sense it, but it wasn\u2019t noticeable and caused no anxiety. I have also been taking Panadol all day and yesterday as I\u2019ve had a bad cold. The worst of it was today, but it started yesterday during the day.",
    '2026-02-14': "Still absolute liquid on the second stool. I wonder if I should only take magnesium with meals and only take B2 and creatine with meals as well",
    '2026-02-15': "Had poor sleep last night probably due to the 300mg b2. It was probably too much for my system without the b1 without a transition from low dose. I had a lot of trouble falling asleep but then slept later. Sleep score of only 63 on garmin.\n\nDuration 6h 54m\nStress 25\nDeep 13m\nLight 5h 53m\nREM 48m\n\nI wonder too if this caused the overnight development of a headache. \n\nThe type of neuropathy I\u2019ve had in the last couple of days is the same type I\u2019ve had primarily since December which is a dull pain in the first knuckles of my right hand with just a little in the left. \n\nFinally feeling like my cold is dissipating. I think I\u2019ll be back to normal tomorrow.",
    '2026-02-16': "I'd say air hunger is non-zero. Not 1.",
    '2026-02-17': "Heavy on the carbohydrates this evening. I think this could be a key. I now have that sharp electrical Type nerve pain that I haven\u2019t had in quite a while and I wonder if it has to do with sugar levels. I had this a lot in 2020. But it\u2019s been quite a while since I\u2019ve had it now. The nerve pain I\u2019ve been experiencing more recently, has been a dull knuckle Localized nerve pain. The sharp and acute but short pain happens a lot in my fingers, but also even in my eyeballs. Almost like electrical shocks. Extremely different than the other type of Nerve pain. Very difficult to fall asleep tonight. Maybe due to the low magnesium?",
  };

  let restoredNotes = 0;
  let skippedNotes = 0;

  Object.entries(notesData).forEach(([dateKey, note]) => {
    if (dailyNotes[dateKey]) {
      log(`Skipping note for ${dateKey} (already exists)`);
      skippedNotes++;
      return;
    }
    log(`+ Note: ${dateKey} (${note.substring(0, 60)}...)`);
    if (forReal) {
      dailyNotes[dateKey] = note;
    }
    restoredNotes++;
  });

  log('');
  log(`Daily notes: ${restoredNotes} to restore, ${skippedNotes} already exist`, restoredNotes > 0 ? 'success' : '');

  // === SAVE ===
  if (forReal) {
    localStorage.setItem('symptomTracker_entries', JSON.stringify(entries));
    localStorage.setItem('symptomTracker_stackEntries', JSON.stringify(stackEntries));
    localStorage.setItem('symptomTracker_inputEntries', JSON.stringify(inputEntries));
    localStorage.setItem('symptomTracker_notes', JSON.stringify(dailyNotes));
    // Update timestamp so this gets synced to cloud
    localStorage.setItem('symptomTracker_localUpdatedAt', Date.now().toString());

    log('');
    log('=== DATA SAVED TO LOCALSTORAGE ===', 'success');
    log('Reload the app to see restored data. It will auto-sync to cloud.', 'success');
  } else {
    log('');
    log('=== DRY RUN COMPLETE \u2014 nothing was changed ===', 'warn');
    log('Click "Restore Data" to actually save.', 'warn');
  }
}
