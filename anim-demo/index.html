<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#08090a">
<title>Home Motion Lab</title>
<style>
:root { --bg: #08090a; --card: #17191c; --text: #f3f4f6;
  --grad: linear-gradient(to bottom, rgba(8,9,10,.34) 0%, rgba(8,9,10,.78) 34%, rgba(8,9,10,.78) 78%, rgba(8,9,10,.5) 100%); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; overscroll-behavior: none; }
button { font-family: inherit; cursor: pointer; }

#phone { --prad: 0px; position: relative; width: 100%; height: 100dvh; overflow: hidden; background: var(--bg); isolation: isolate; }
@media (min-width: 520px) {
  body { display: grid; place-items: center; min-height: 100vh; background: #1b1d21; }
  #phone { --prad: 46px; width: 390px; height: 844px; border-radius: var(--prad); box-shadow: 0 0 0 10px #000, 0 30px 80px rgba(0,0,0,.6); }
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* ---------- Home (copied from home.css) ---------- */
#home { transition: transform .55s cubic-bezier(.22,1,.36,1), filter .55s; }
#home.recede { transform: scale(.93); filter: brightness(.45); }
#home.gone { opacity: 0; pointer-events: none; transition: none; }
.hm { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: calc(16px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom)); }
.hm-card { position: relative; flex: 1 1 0; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 20px; overflow: hidden; background-size: cover; background-position: center; background-color: var(--card); transition: transform .2s cubic-bezier(.22,1,.36,1); }
.hm-card.press { transform: scale(.97); }
.hm-card::before { content: ''; position: absolute; inset: 0; background: var(--grad); }
.hm-hit { position: absolute; inset: 0; z-index: 2; border: 0; padding: 0; background: none; }
.hm-face { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0 16px; text-align: center; pointer-events: none; transition: opacity .3s; }
.hm-face h2 { margin: 0; font-size: 25px; font-weight: 600; letter-spacing: -.015em; line-height: 1.2; }
.hm-face small { color: #aab6c6; font-size: 12.5px; }
#home.noface .hm-face { opacity: 0; transition: opacity .12s; }

/* ---------- Expanded card (option 1) ---------- */
.xp { position: absolute; inset: 0; z-index: 300; transform-origin: 50% 25%; touch-action: none; }
.xp-bg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: var(--prad); overflow: hidden; background: var(--card) center / cover no-repeat; }
.xp-bg i { position: absolute; inset: 0; }
.xp-bg .g1 { background: var(--grad); }
.xp-bg .g2 { background: linear-gradient(to bottom, rgba(8,9,10,.72) 0%, rgba(8,9,10,.4) 30%, rgba(8,9,10,.45) 48%, rgba(8,9,10,.9) 74%, rgba(8,9,10,.97) 100%); }
.xp-head { position: absolute; left: 24px; right: 24px; top: calc(70px + env(safe-area-inset-top)); pointer-events: none; }
.xp-head h2 { display: inline-block; margin: 0; font-size: 38px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; transform-origin: 0 0; text-shadow: 0 2px 24px rgba(0,0,0,.45); }
.xp-head small { display: block; margin-top: 10px; color: #cbd5e1; font-size: 15px; }
.xp-x { position: absolute; z-index: 2; top: calc(18px + env(safe-area-inset-top)); right: 18px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; display: grid; place-items: center; }
.xp-x svg { width: 16px; height: 16px; }
.xp-opts { position: absolute; left: 18px; right: 18px; bottom: calc(40px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; gap: 14px; }
.xp-opts button { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; border: 0; color: #fff; font-size: 21px; font-weight: 700; letter-spacing: -.015em; padding: 21px 20px; border-radius: 18px; background: rgba(255,255,255,.14); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: transform .15s, background .15s; }
.xp-opts button:active { transform: scale(.97); background: rgba(255,255,255,.24); }
.xp-opts button.deep { width: auto; margin-top: 4px; padding: 8px 12px; border-radius: 10px; background: none; backdrop-filter: none; -webkit-backdrop-filter: none; font-size: 16px; font-weight: 500; letter-spacing: 0; color: #cbd5e1; }
.ic { width: 1em; height: 1em; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Advanced (stand-in) ---------- */
#adv { gap: 8px; padding: calc(14px + env(safe-area-inset-top)) 12px calc(100px + env(safe-area-inset-bottom)); opacity: 0; pointer-events: none; }
#adv.on { opacity: 1; pointer-events: auto; }
.adv-top { flex: none; height: 64px; border-radius: 16px; background: #121316; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; }
.adv-date { display: flex; align-items: center; gap: 14px; font-size: 15px; font-weight: 600; }
.adv-date b { color: #6b7280; font-weight: 400; font-size: 18px; }
.adv-score { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 700; background: conic-gradient(#a78bfa 0 82%, #2a2d33 0); position: relative; }
.adv-score::before { content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #121316; }
.adv-score span { position: relative; }
.adv-h { flex: none; height: 38px; border-radius: 12px; background: #0f1012; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #9ca3af; }
.adv-h span { text-transform: none; letter-spacing: 0; font-weight: 500; color: #6b7280; }
.adv-row { flex: none; height: 56px; border-radius: 14px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 16px; font-weight: 500; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: #2a2d33; }
.dots i.l1 { background: #34d399; } .dots i.l2 { background: #fbbf24; } .dots i.l3 { background: #f87171; }
#adv [data-slot] > * { opacity: 0; transform: translateY(5px); transition: opacity .35s, transform .45s cubic-bezier(.22,1,.36,1); transition-delay: calc(var(--i, 0) * 30ms); }
#adv.on:not(.notext) [data-slot] > * { opacity: 1; transform: none; }
#adv.notext [data-slot] > * { transition-duration: .12s; transition-delay: 0s; }

/* ---------- Shatter tiles (option B) ---------- */
#fx { position: absolute; inset: 0; z-index: 250; pointer-events: none; perspective: 900px; }
.tile { position: absolute; left: 0; top: 0; transform-origin: 0 0; background-repeat: no-repeat; will-change: transform; backface-visibility: visible; }
.tile i { position: absolute; inset: 0; opacity: 0; }
.ring { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); }

/* ---------- Dock (copied from mobileNav.css) ---------- */
.mn-dock { position: absolute; left: 0; right: 0; bottom: 0; z-index: 200; pointer-events: none; padding: 28px 14px calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(to top, #08090a 62%, transparent); font-size: 13px; transition: transform .45s cubic-bezier(.22,1,.36,1), opacity .3s; }
.mn-dock.recede { transform: translateY(40px); opacity: 0; }
.mn-dock-in { max-width: 472px; margin: 0 auto; display: flex; align-items: center; gap: 10px; pointer-events: auto; }
.mn-tabs { flex: 1; display: grid; padding: 4px; border-radius: 22px; background: rgba(23,25,28,.94); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.mn-layer { grid-area: 1 / 1; min-width: 0; }
.mn-tablist { display: flex; }
.mn-tablist button { flex: 1; min-width: 0; height: 46px; padding: 0 2px; border: 0; border-radius: 18px; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6b7280; font-size: 10px; font-weight: 500; transition: opacity .24s ease, transform .36s cubic-bezier(.22,1,.36,1), background .2s, color .2s; transition-delay: calc(var(--i) * 35ms + 60ms); }
.mn-tablist button .ic { width: 20px; height: 20px; }
.mn-tablist button.on { background: rgba(255,255,255,.08); color: #f3f4f6; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
.mn-tabs.easy .mn-tablist { pointer-events: none; }
.mn-tabs.easy .mn-tablist button { opacity: 0; transform: translateX(calc((1.5 - var(--i)) * 22px)) scale(.8); transition-delay: 0s; }
.mn-adv { height: 46px; border: 0; border-radius: 18px; background: none; color: #e5e7eb; font-size: 15px; font-weight: 600; letter-spacing: -.01em; opacity: 0; transform: scale(.94); pointer-events: none; transition: opacity .18s ease, transform .32s cubic-bezier(.22,1,.36,1); }
.mn-tabs.easy .mn-adv { opacity: 1; transform: none; pointer-events: auto; transition-delay: .16s; }
.mn-adv:active { background: rgba(255,255,255,.08); }
.mn-more { width: 54px; height: 54px; flex: none; border-radius: 50%; border: 1px solid rgba(255,255,255,.12); background: rgba(23,25,28,.94); color: #9ca3af; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.mn-more .ic { width: 24px; height: 24px; }

/* ---------- Toast + tuning ---------- */
#toast { position: absolute; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); z-index: 400; transform: translate(-50%, 10px); padding: 10px 16px; border-radius: 12px; background: rgba(40,42,48,.96); font-size: 14px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s cubic-bezier(.22,1,.36,1); }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#tuneBtn { position: fixed; z-index: 500; bottom: calc(92px + env(safe-area-inset-bottom)); right: 20px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.18); background: rgba(20,21,24,.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #e5e7eb; font-size: 12px; font-weight: 600; }
#tune { position: fixed; z-index: 500; bottom: calc(130px + env(safe-area-inset-bottom)); right: 16px; width: 260px; padding: 14px 16px; border-radius: 16px; background: rgba(20,21,24,.97); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 20px 50px rgba(0,0,0,.6); font-size: 13px; }
#tune[hidden] { display: none; }
#tune label { display: block; margin-bottom: 12px; color: #9ca3af; }
#tune label b { float: right; color: #f3f4f6; font-weight: 600; }
#tune input { width: 100%; margin-top: 6px; accent-color: #a78bfa; }
#tune p { margin: 0 0 12px; color: #6b7280; line-height: 1.4; }
#tune button { width: 100%; padding: 8px; border-radius: 10px; border: 0; background: rgba(255,255,255,.08); color: #e5e7eb; }
@media (min-width: 520px) { #tuneBtn { bottom: auto; right: 24px; top: 24px; } #tune { bottom: auto; right: 20px; top: 62px; } }
</style>
</head>
<body>
<div id="phone">
  <div id="home" class="screen"><div class="hm"></div></div>

  <div id="adv" class="screen" aria-label="Advanced mode (stand-in)">
    <div class="adv-top" data-slot>
      <div class="adv-date"><b>‹</b>Mon, Sep 22<b>›</b></div>
      <div class="adv-score"><span>82</span></div>
    </div>
    <div class="adv-h" data-slot style="--i:1"><div>Symptoms</div><span>8 tracked</span></div>
  </div>

  <div class="mn-dock">
    <div class="mn-dock-in">
      <div class="mn-tabs easy">
        <div class="mn-layer mn-tablist" role="tablist"></div>
        <button class="mn-layer mn-adv">Advanced mode</button>
      </div>
      <button class="mn-more" aria-label="More actions"><svg class="ic" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
    </div>
  </div>

  <div id="fx"></div>
  <div id="toast"></div>
</div>

<button id="tuneBtn">Tune</button>
<div id="tune" hidden>
  <p>Stand-in screens. Drag an open card down to dismiss it.</p>
  <label>Speed <b data-o="speed"></b><input type="range" data-k="speed" min="0.2" max="1.5" step="0.05"></label>
  <label>Bounce <b data-o="bounce"></b><input type="range" data-k="bounce" min="0" max="1" step="0.05"></label>
  <label>Chaos <b data-o="chaos"></b><input type="range" data-k="chaos" min="0" max="2" step="0.1"></label>
  <label>Tiles across <b data-o="tiles"></b><input type="range" data-k="tiles" min="3" max="10" step="1"></label>
  <button id="reset">Reset</button>
</div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const phone = $('#phone'), home = $('#home'), adv = $('#adv'), fx = $('#fx'), dock = $('.mn-dock'), tabs = $('.mn-tabs');
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const GRAD = getComputedStyle(document.documentElement).getPropertyValue('--grad').trim();

const ICONS = {
  bolt: 'M13 2 4 14h7l-1 8 9-12h-7z',
  mic: 'M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v3',
  list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
  camera: 'M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',
  edit: 'M4 20h4L19 9l-4-4L4 16z',
  note: 'M6 3h9l4 4v14H6zM9 12h7M9 16h7',
  repeat: 'M17 2l3 3-3 3M4 11V9a4 4 0 0 1 4-4h12M7 22l-3-3 3-3M20 13v2a4 4 0 0 1-4 4H4',
  check: 'M4 12l5 5L20 6',
  more: 'M5 12h.01M12 12h.01M19 12h.01',
  chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
  x: 'M6 6l12 12M18 6 6 18',
};
const icon = (n) => `<svg class="ic" viewBox="0 0 24 24"><path d="${ICONS[n]}"/></svg>`;

const CARDS = [
  { id: 'symptoms', title: 'Log symptoms', art: 'symptoms.jpg', line: '3 logged today', options: [
    { icon: 'bolt', label: 'Rapid entry' }, { icon: 'mic', label: 'Talk me through it' }, { icon: 'list', label: 'Full list', deep: true } ] },
  { id: 'meals', title: 'Log a meal', art: 'meals.jpg', line: 'Breakfast · 8:10am', options: [
    { icon: 'camera', label: 'Photo' }, { icon: 'edit', label: 'Type it' }, { icon: 'note', label: "Today's meals", deep: true } ] },
  { id: 'supplements', title: 'Log supplements', art: 'supplements.jpg', line: '4 of 7 taken', options: [
    { icon: 'repeat', label: 'Match yesterday' }, { icon: 'check', label: 'Simple checklist' }, { icon: 'more', label: 'Full detail', deep: true } ] },
];
const TABS = [['home', 'Home', 'bolt'], ['symptoms', 'Symptoms', 'list'], ['stack', 'Protocol', 'check'], ['insights', 'Progress', 'chart']];
const ROWS = [['Headache', 2], ['Fatigue', 3], ['Brain fog', 2], ['Bloating', 1], ['Joint pain', 0], ['Nausea', 1], ['Anxiety', 2], ['Sleep quality', 3]];

// ---------- settings ----------
const DEF = { speed: 1, bounce: 0.5, chaos: 1, tiles: 6 };
let cfg = { ...DEF };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('motionlab') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('motionlab', JSON.stringify(cfg)); } catch {} };
const T = (ms) => ms / cfg.speed;

// ---------- springs, sampled into CSS linear() ----------
const HAS_LINEAR = CSS.supports('transition-timing-function', 'linear(0, 1)');
const springCache = {};
function spring(k, zeta) {
  const key = k + ':' + zeta.toFixed(3);
  if (springCache[key]) return springCache[key];
  if (!HAS_LINEAR) return (springCache[key] = { easing: zeta < .8 ? 'cubic-bezier(.34,1.45,.64,1)' : 'cubic-bezier(.22,1,.36,1)', ms: 650 });
  const c = 2 * zeta * Math.sqrt(k);
  let x = 0, v = 0, t = 0, next = 1 / 60;
  const pts = [0], dt = 1 / 240;
  while (t < 4) {
    v += (k * (1 - x) - c * v) * dt; x += v * dt; t += dt;
    if (t >= next) { pts.push(+x.toFixed(4)); next += 1 / 60; if (t > .2 && Math.abs(1 - x) < .002 && Math.abs(v) < .03) break; }
  }
  pts[pts.length - 1] = 1;
  return (springCache[key] = { easing: `linear(${pts.join(',')})`, ms: t * 1000 });
}
const ease = (kind) => {
  const b = cfg.bounce;
  return {
    card: () => spring(190, 1 - .55 * b),
    btn: () => spring(260, .95 - .62 * b),
    close: () => spring(230, Math.min(1, 1.05 - .3 * b)),
    tile: () => spring(150, .95 - .62 * b),
  }[kind]();
};

// ---------- helpers ----------
const rel = (el) => { const p = phone.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - p.left, y: r.top - p.top, w: r.width, h: r.height }; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1400); }

const imgs = {};
const ready = Promise.all(CARDS.map((c) => new Promise((res) => { const im = new Image(); im.onload = () => { imgs[c.id] = { w: im.naturalWidth, h: im.naturalHeight }; res(); }; im.onerror = () => { imgs[c.id] = { w: 1000, h: 1000 }; res(); }; im.src = c.art; })));

// ---------- build ----------
$('.hm').innerHTML = CARDS.map((c, i) => `<section class="hm-card" data-i="${i}" style="background-image:url(${c.art})">
  <button type="button" class="hm-hit" aria-label="${c.title} — show options"></button>
  <div class="hm-face"><h2>${c.title}</h2><small>${c.line}</small></div></section>`).join('');
$('.mn-tablist').innerHTML = TABS.map(([id, label, ic], i) => `<button role="tab" data-t="${id}" style="--i:${i}" class="${id === 'home' ? 'on' : ''}">${icon(ic)}<span>${label}</span></button>`).join('');
adv.insertAdjacentHTML('beforeend', ROWS.map(([n, s], i) => `<div class="adv-row" data-slot style="--i:${i + 2}"><div>${n}</div><div class="dots">${[1, 2, 3, 4, 5].map((d) => `<i class="${d <= s ? 'l' + s : ''}"></i>`).join('')}</div></div>`).join(''));

// ================= Option 1: card morph =================
let open = null, busy = false, mode = 'home';

function openCard(card) {
  if (busy || open || mode !== 'home') return;
  busy = true;
  const data = CARDS[+card.dataset.i];
  card.style.transition = 'none'; card.classList.remove('press'); card.offsetWidth; card.style.transition = '';
  const r = rel(card), tr = rel($('h2', card));
  const P = { w: phone.clientWidth, h: phone.clientHeight }, rad = getComputedStyle(phone).getPropertyValue('--prad').trim() || '0px';

  const xp = document.createElement('div');
  xp.className = 'xp';
  xp.innerHTML = `<div class="xp-bg" style="background-image:url(${data.art})"><i class="g1"></i><i class="g2"></i></div>
    <button class="xp-x" aria-label="Close">${icon('x')}</button>
    <div class="xp-head"><h2>${data.title}</h2><small>${data.line}</small></div>
    <div class="xp-opts">${data.options.map((o) => `<button class="${o.deep ? 'deep' : ''}" data-l="${o.label}">${icon(o.icon)}<span>${o.label}</span></button>`).join('')}</div>`;
  phone.appendChild(xp);
  card.style.visibility = 'hidden';
  open = { card, xp, r, tr };
  wireOverlay(xp);

  if (RM) { xp.animate([{ opacity: 0 }, { opacity: 1 }], 200).finished.then(() => (busy = false)); return; }

  home.classList.add('recede'); dock.classList.add('recede');
  const sp = ease('card'), bs = ease('btn');
  const bg = $('.xp-bg', xp), h2 = $('h2', xp), lr = rel(h2);
  xp.style.pointerEvents = 'none';
  const main = bg.animate([
    { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: '20px' },
    { left: '0px', top: '0px', width: P.w + 'px', height: P.h + 'px', borderRadius: rad },
  ], { duration: T(sp.ms), easing: sp.easing });
  $('.g1', xp).animate([{ opacity: 1 }, { opacity: 0 }], { duration: T(450), easing: 'ease-out', fill: 'forwards' });
  $('.g2', xp).animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(450), easing: 'ease-out' });
  h2.animate([{ transform: `translate(${tr.x - lr.x}px,${tr.y - lr.y}px) scale(${tr.h / lr.h})` }, { transform: 'none' }], { duration: T(sp.ms), easing: sp.easing });
  $('small', xp).animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: T(400), delay: T(160), easing: 'cubic-bezier(.22,1,.36,1)', fill: 'backwards' });
  $('.xp-x', xp).animate([{ opacity: 0, transform: 'scale(.5) rotate(-90deg)' }, { opacity: 1, transform: 'none' }], { duration: T(bs.ms), delay: T(200), easing: bs.easing, fill: 'backwards' });
  xp.querySelectorAll('.xp-opts button').forEach((b, i) => b.animate(
    [{ opacity: 0, transform: 'translateY(90px) scale(.86)' }, { opacity: 1, transform: 'none' }],
    { duration: T(bs.ms), delay: T(150 + i * 70), easing: bs.easing, fill: 'backwards' }));
  main.finished.then(() => { busy = false; xp.style.pointerEvents = ''; });
}

function closeCard() {
  if (busy || !open) return;
  busy = true;
  const { card, xp, r, tr } = open;
  if (RM) { xp.animate([{ opacity: 1 }, { opacity: 0 }], 200).finished.then(() => { card.style.visibility = ''; xp.remove(); open = null; busy = false; }); return; }

  const bg = $('.xp-bg', xp), h2 = $('h2', xp);
  const cb = rel(bg), ch = rel(h2), curRad = getComputedStyle(bg).borderTopLeftRadius;
  xp.getAnimations({ subtree: true }).forEach((a) => a.cancel());
  xp.style.transform = ''; bg.style.borderRadius = '';
  const lh = rel(h2);
  home.classList.remove('recede'); dock.classList.remove('recede');
  const sp = ease('close');
  const o = { duration: T(sp.ms), easing: sp.easing, fill: 'forwards' };
  const main = bg.animate([
    { left: cb.x + 'px', top: cb.y + 'px', width: cb.w + 'px', height: cb.h + 'px', borderRadius: curRad },
    { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', borderRadius: '20px' },
  ], o);
  h2.animate([
    { transform: `translate(${ch.x - lh.x}px,${ch.y - lh.y}px) scale(${ch.h / lh.h})` },
    { transform: `translate(${tr.x - lh.x}px,${tr.y - lh.y}px) scale(${tr.h / lh.h})` },
  ], o);
  $('.g1', xp).animate([{ opacity: 0 }, { opacity: 1 }], { duration: T(300), fill: 'forwards' });
  $('.g2', xp).animate([{ opacity: 1 }, { opacity: 0 }], { duration: T(300), fill: 'forwards' });
  [$('small', xp), $('.xp-x', xp), ...xp.querySelectorAll('.xp-opts button')].forEach((el, i) =>
    el.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(40px) scale(.94)' }], { duration: T(180), delay: T(i * 25), easing: 'ease-in', fill: 'forwards' }));
  main.finished.then(() => { card.style.visibility = ''; xp.remove(); open = null; busy = false; });
}

function wireOverlay(xp) {
  const bg = $('.xp-bg', xp);
  $('.xp-x', xp).onclick = closeCard;
  xp.querySelectorAll('.xp-opts button').forEach((b) => (b.onclick = () => toast(`“${b.dataset.l}” would open here`)));
  let y0 = null, dy = 0;
  xp.addEventListener('pointerdown', (e) => { if (busy || e.target.closest('button')) return; y0 = e.clientY; dy = 0; xp.setPointerCapture(e.pointerId); });
  xp.addEventListener('pointermove', (e) => {
    if (y0 === null) return;
    dy = Math.max(0, e.clientY - y0);
    const p = Math.min(dy / 400, 1);
    xp.style.transform = `translateY(${dy * 0.4}px) scale(${1 - p * 0.2})`;
    bg.style.borderRadius = `${28 + p * 30}px`;
  });
  const up = () => {
    if (y0 === null) return;
    y0 = null;
    if (dy > 90) return closeCard();
    const from = xp.style.transform, sp = ease('card');
    xp.style.transform = ''; bg.style.borderRadius = '';
    if (from) xp.animate([{ transform: from }, { transform: 'none' }], { duration: T(sp.ms), easing: sp.easing });
  };
  xp.addEventListener('pointerup', up);
  xp.addEventListener('pointercancel', up);
}

home.addEventListener('pointerdown', (e) => { const c = e.target.closest('.hm-card'); if (c && !busy) c.classList.add('press'); });
['pointerup', 'pointercancel', 'pointerleave'].forEach((ev) => home.addEventListener(ev, () => home.querySelectorAll('.press').forEach((c) => c.classList.remove('press'))));
home.addEventListener('click', (e) => { const c = e.target.closest('.hm-card'); if (c) openCard(c); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeCard(); });

// ================= Option B: shatter =================
function photoTiles() {
  const out = [], cols = cfg.tiles;
  home.querySelectorAll('.hm-card').forEach((card, ci) => {
    const r = rel(card), d = CARDS[ci], im = imgs[d.id];
    const s = Math.max(r.w / im.w, r.h / im.h), iw = im.w * s, ih = im.h * s, ox = (r.w - iw) / 2, oy = (r.h - ih) / 2;
    const tw = r.w / cols, rows = Math.max(2, Math.round(r.h / tw)), th = r.h / rows;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const tx = x * tw, ty = y * th;
      out.push({ x: r.x + tx, y: r.y + ty, w: tw, h: th,
        bg: `${GRAD}, url(${d.art})`, size: `${r.w}px ${r.h}px, ${iw}px ${ih}px`, pos: `${-tx}px ${-ty}px, ${ox - tx}px ${oy - ty}px` });
    }
  });
  return out;
}
function slots(n) {
  const els = [...adv.querySelectorAll('[data-slot]')], rects = els.map(rel);
  const s = Math.sqrt(rects.reduce((a, r) => a + r.w * r.h, 0) / n), out = [];
  els.forEach((el, i) => {
    const r = rects[i], color = getComputedStyle(el).backgroundColor;
    const cols = Math.max(1, Math.round(r.w / s)), rows = Math.max(1, Math.round(r.h / s));
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++)
      out.push({ x: r.x + x * r.w / cols, y: r.y + y * r.h / rows, w: r.w / cols, h: r.h / rows, color });
  });
  return out;
}
const tf = (dx, dy, rx, ry, rz, sx, sy) => `translate(${dx}px,${dy}px) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${rz}deg) scale(${sx},${sy})`;

// toAdv: photos burst from the Advanced button and land as the advanced layout's blocks.
// !toAdv: the blocks burst from the Home tab and land back as the photographs.
function shatter(toAdv, origin) {
  const ph = photoTiles(), sl = slots(ph.length), chaos = cfg.chaos;
  const jitter = (a) => a.map((t) => [t, t.y + rand(0, 260) * chaos + t.x * 0.2]).sort((a, b) => a[1] - b[1]).map((a) => a[0]);
  const P = jitter(ph), S = jitter(sl), N = Math.max(P.length, S.length);
  const sp = ease('tile'), burst = 400, total = burst + sp.ms, off = burst / total;
  const anims = [];
  const frag = document.createDocumentFragment();

  for (let i = 0; i < N; i++) {
    const p = P[i % P.length], s = S[i % S.length];
    const el = document.createElement('div');
    el.className = 'tile';
    Object.assign(el.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 0.6 + 'px', height: p.h + 0.6 + 'px', backgroundImage: p.bg, backgroundSize: p.size, backgroundPosition: p.pos });
    const tint = document.createElement('i');
    tint.style.background = s.color;
    el.appendChild(tint);
    frag.appendChild(el);

    const ssx = s.w / p.w, ssy = s.h / p.h;
    const atP = tf(0, 0, 0, 0, 0, 1, 1), atS = tf(s.x - p.x, s.y - p.y, 0, 0, 0, ssx, ssy);
    const src = toAdv ? p : s, cx = src.x + src.w / 2, cy = src.y + src.h / 2;
    let vx = cx - origin.x, vy = cy - origin.y; const len = Math.hypot(vx, vy) || 1; vx /= len; vy /= len;
    const mag = rand(60, 230) * chaos, side = rand(-60, 60) * chaos;
    const bcx = cx + vx * mag - vy * side, bcy = cy + vy * mag + vx * side;
    const k = rand(.75, 1.25), bsx = (1 + ssx) / 2 * k, bsy = (1 + ssy) / 2 * k;
    const bT = tf(bcx - p.w * bsx / 2 - p.x, bcy - p.h * bsy / 2 - p.y, rand(-80, 80) * chaos, rand(-80, 80) * chaos, rand(-200, 200) * chaos, bsx, bsy);
    const delay = T(len * 0.45 + rand(0, 90) * chaos);
    const o = { duration: T(total), delay, fill: 'both' };
    anims.push(el.animate([
      { transform: toAdv ? atP : atS, easing: 'cubic-bezier(.1,.75,.25,1)' },
      { transform: bT, offset: off, easing: sp.easing },
      { transform: toAdv ? atS : atP },
    ], o));
    const land = off + (1 - off) * 0.35;
    tint.animate(toAdv
      ? [{ opacity: 0 }, { opacity: 0, offset: off * 0.5 }, { opacity: 1, offset: land }, { opacity: 1 }]
      : [{ opacity: 1 }, { opacity: 0.4, offset: off }, { opacity: 0, offset: land }, { opacity: 0 }], o);
  }
  fx.appendChild(frag);

  const ring = document.createElement('div');
  ring.className = 'ring';
  Object.assign(ring.style, { left: origin.x + 'px', top: origin.y + 'px' });
  fx.appendChild(ring);
  ring.animate([{ transform: 'scale(0)', opacity: .9 }, { transform: 'scale(14)', opacity: 0 }], { duration: T(520), easing: 'cubic-bezier(.1,.7,.3,1)', fill: 'forwards' });

  return Promise.all(anims.map((a) => a.finished));
}

const center = (el) => { const r = rel(el); return { x: r.x + r.w / 2, y: r.y + r.h / 2 }; };
const setTab = (id) => tabs.querySelectorAll('[data-t]').forEach((b) => b.classList.toggle('on', b.dataset.t === id));

async function toAdvanced() {
  if (busy || open || mode !== 'home') return;
  busy = true;
  await ready;
  const origin = center($('.mn-adv'));
  if (RM) { home.classList.add('gone'); adv.classList.add('on'); tabs.classList.remove('easy'); setTab('symptoms'); mode = 'adv'; busy = false; return; }
  home.classList.add('noface');
  await wait(T(110));
  const done = shatter(true, origin);
  home.classList.add('gone');
  tabs.classList.remove('easy'); setTab('symptoms');
  await done;
  adv.classList.add('on');
  fx.replaceChildren();
  mode = 'adv'; busy = false;
}

async function toHome() {
  if (busy || mode !== 'adv') return;
  busy = true;
  await ready;
  const origin = center(tabs.querySelector('[data-t="home"]'));
  tabs.classList.add('easy'); setTab('home');
  if (RM) { adv.classList.remove('on'); home.classList.remove('gone', 'noface'); mode = 'home'; busy = false; return; }
  adv.classList.add('notext');
  await wait(T(120));
  const done = shatter(false, origin);
  adv.classList.remove('on', 'notext');
  await done;
  home.classList.remove('gone');
  fx.replaceChildren();
  home.classList.remove('noface');
  mode = 'home'; busy = false;
}

$('.mn-adv').onclick = toAdvanced;
tabs.querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => (b.dataset.t === 'home' ? toHome() : mode === 'adv' && setTab(b.dataset.t))));
$('.mn-more').onclick = () => toast('Menu is not part of this demo');

// ---------- tuning panel ----------
const tune = $('#tune');
$('#tuneBtn').onclick = () => (tune.hidden = !tune.hidden);
function syncTune() {
  tune.querySelectorAll('[data-k]').forEach((inp) => { inp.value = cfg[inp.dataset.k]; });
  tune.querySelectorAll('[data-o]').forEach((o) => { const k = o.dataset.o, v = cfg[k]; o.textContent = k === 'speed' ? v + '×' : k === 'tiles' ? v : Math.round(v * 100) + '%'; });
}
tune.addEventListener('input', (e) => { const k = e.target.dataset.k; if (!k) return; cfg[k] = +e.target.value; save(); syncTune(); });
$('#reset').onclick = () => { cfg = { ...DEF }; save(); syncTune(); };
syncTune();
</script>
